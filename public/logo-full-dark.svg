<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D5EF5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="320" height="80" rx="12" fill="url(#bg-grad)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(109,94,245,0.06)" stroke-width="0.5"/>
  </pattern>
  <rect width="320" height="80" rx="12" fill="url(#grid)"/>

  <!-- Icon -->
  <g transform="translate(16, 12)">
    <rect width="56" height="56" rx="14" fill="url(#icon-grad)"/>
    <g transform="translate(14, 7)" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <g opacity="0.4"><path d="M14 1L1 7.5L14 14L27 7.5L14 1Z"/><path d="M1 20.5L14 27L27 20.5"/></g>
      <g opacity="0.65"><path d="M14 1L1 7.5L14 14L27 7.5L14 1Z"/><path d="M1 20.5L14 27L27 20.5"/></g>
      <path d="M14 1L1 7.5L14 14L27 7.5L14 1Z"/>
      <path d="M1 14L14 20.5L27 14"/>
      <path d="M1 20.5L14 27L27 20.5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="88" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Nextill</text>
  <text x="199" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="300" fill="#8B7BF7" letter-spacing="-0.5">AI</text>

  <!-- Tagline -->
  <text x="88" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="rgba(167,176,192,0.6)" letter-spacing="0.5">AI-Powered SEO Tools &amp; Content Platform</text>
</svg>
