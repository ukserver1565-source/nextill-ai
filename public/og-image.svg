<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0C1125"/>
    </linearGradient>
    <linearGradient id="logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D5EF5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(109,94,245,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative glow circle -->
  <circle cx="600" cy="280" r="200" fill="rgba(109,94,245,0.06)"/>

  <!-- Logo icon -->
  <g filter="url(#glow)">
    <rect x="540" y="130" width="120" height="120" rx="28" fill="url(#logo)"/>
    <g transform="translate(572, 160)">
      <path d="M28 0L0 14l28 14 28-14L28 0zM0 42l28 14 28-14M0 28l28 14 28-14"
            stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="64" font-weight="bold" fill="white">Nextill AI</text>

  <!-- Subtitle -->
  <text x="600" y="385" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="26" fill="#A7B0C0">AI-Powered SEO Tools &amp; Content Platform</text>

  <!-- Feature pills -->
  <g transform="translate(600, 440)" text-anchor="middle">
    <rect x="-310" y="-18" width="180" height="36" rx="8" fill="rgba(109,94,245,0.12)" stroke="rgba(109,94,245,0.3)" stroke-width="1"/>
    <text x="-220" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8B7BF7">Keyword Research</text>

    <rect x="-90" y="-18" width="180" height="36" rx="8" fill="rgba(109,94,245,0.12)" stroke="rgba(109,94,245,0.3)" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8B7BF7">Post Generator</text>

    <rect x="130" y="-18" width="180" height="36" rx="8" fill="rgba(109,94,245,0.12)" stroke="rgba(109,94,245,0.3)" stroke-width="1"/>
    <text x="220" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8B7BF7">Plagiarism Checker</text>
  </g>

  <!-- URL bar -->
  <text x="600" y="530" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="18" fill="rgba(167,176,192,0.5)">nextill.ai</text>
</svg>
